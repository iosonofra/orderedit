<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3768d6" />
      <stop offset="50%" stop-color="#5c8df6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#5c8df6" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Stylized order sheet background with a modern gradient -->
  <rect x="4" y="6" width="24" height="20" rx="4.5" fill="url(#primary-grad)" filter="url(#glow)" />
  
  <!-- Spreadsheet / grid layout representation inside the sheet -->
  <rect x="7.5" y="9.5" width="17" height="13" rx="1.5" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.5" />
  <line x1="13" y1="9.5" x2="13" y2="22.5" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2" />
  <line x1="7.5" y1="14" x2="24.5" y2="14" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2" />
  <line x1="7.5" y1="18" x2="24.5" y2="18" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2" />

  <!-- Glowing editing pen/magic sparkle floating on the top-right -->
  <g filter="url(#glow)">
    <path d="M25.5 3.5L28.5 6.5L18.5 16.5H15.5V13.5L25.5 3.5Z" fill="#ffffff" />
    <path d="M28.5 1.5L29.3 3.1L30.9 3.9L29.3 4.7L28.5 6.3L27.7 4.7L26.1 3.9L27.7 3.1L28.5 1.5Z" fill="url(#sparkle-grad)" />
  </g>
</svg>